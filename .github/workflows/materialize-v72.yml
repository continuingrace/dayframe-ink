name: Materialize Dayframe Ink V72

on:
  workflow_dispatch:
  push:
    paths:
      - 'materialize-v72.mjs'
      - '.github/workflows/materialize-v72.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize static V72
        run: node materialize-v72.mjs
      - name: Verify V72 invariants
        run: |
          grep -q 'V72 STATIC BUILD' v72.html
          grep -q 'export the text from the exact DOM layout' v72.html
          ! grep -q 'render();drawPlacedArt();applyOuter();updateGuides();' v72.html
          grep -q 'id="resetToday"' v72.html
          ! grep -q "fetch('./base-v59.html" v72.html
          ! grep -q "fetch('./v66.html" v72.html
      - name: Commit static V72
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v72.html index.html
          git commit -m "Publish Dayframe Ink V72 preview-matched text export"
          git push
