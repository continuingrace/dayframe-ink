name: Materialize Dayframe Ink V70

on:
  workflow_dispatch:
  push:
    paths:
      - 'materialize-v70.mjs'
      - '.github/workflows/materialize-v70.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize static V70
        run: node materialize-v70.mjs
      - name: Verify V70 invariants
        run: |
          grep -q 'V70 STATIC BUILD' v70.html
          ! grep -q 'CUT 1 새 지문' v70.html
          ! grep -q "fetch('./base-v59.html" v70.html
          ! grep -q "fetch('./v66.html" v70.html
      - name: Commit static V70
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v70.html index.html
          git commit -m "Publish Dayframe Ink V70 preserving completed CUT captions"
          git push
