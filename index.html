<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f0e7"><title>Dayframe Ink</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f0e7;color:#191816;font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif}.wrap{max-width:760px;margin:auto;padding:22px 18px 64px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.eyebrow{font-size:10px;letter-spacing:.15em;color:#777;margin:0 0 4px}.head h1{font-size:23px;margin:0}.ver{font-size:12px;padding:6px 9px;background:#e7e1d6;border-radius:99px}.card{background:#fffdf8;border-radius:24px;padding:17px;box-shadow:0 10px 32px #3c33230d}.paper{background:#fff;padding:15px;border-radius:5px}.header{display:grid;grid-template-columns:1.4fr .8fr;gap:10px;margin-bottom:11px}.box{height:38px;position:relative}.art{height:360px;position:relative;margin-bottom:11px;background:#fdfdfb}.ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:13px}.note{height:160px;position:relative;padding:18px 0}.guide{box-sizing:border-box}.guide{position:absolute;left:16px;right:16px;height:1px;background:#625f58;opacity:.56}.g1{top:40px}.g2{top:80px}.g3{top:120px}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.controls{display:grid;gap:13px;margin-top:18px}.row{display:grid;grid-template-columns:104px 1fr 45px;gap:10px;align-items:center}.row label{font-size:12px;font-weight:650}.row output{font-size:11px;color:#777;text-align:right}input{width:100%}.desc{font-size:12px;color:#777;line-height:1.6;margin:16px 2px 0}.swatch{display:inline-flex;align-items:center;gap:7px;margin-top:12px;font-size:11px;color:#666}.dot{width:14px;height:14px;border-radius:50%;background:#191816;border:1px solid #ddd}
.workflow{display:grid;gap:14px;margin-top:18px}.wf{background:#fffdf8;border-radius:20px;padding:18px}.wf h2{font-size:17px;margin:0 0 12px}.upload{border:1px dashed #aaa69b;border-radius:15px;padding:22px;text-align:center;display:block}.upload input{display:none}.thumbs{display:flex;gap:8px;overflow:auto;margin-top:10px}.thumbs img{width:68px;height:68px;object-fit:cover;border-radius:10px}.field{width:100%;border:1px solid #d8d3c9;background:white;border-radius:12px;padding:13px;margin-top:9px;font:inherit}.area{min-height:150px;resize:vertical}.seg{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:10px}.seg button,.action{border:1px solid #25231f;background:#fffdf8;border-radius:11px;padding:12px;font-weight:700}.seg button.on,.action.primary{background:#191816;color:#fff}.action{width:100%;margin-top:10px}.prompt{min-height:310px;font-size:12px;line-height:1.55}.hint{font-size:11px;color:#777;line-height:1.55}.label{display:block;font-size:11px;font-weight:700;margin-top:13px}</style></head><body><div class="wrap"><div class="head"><div><p class="eyebrow">INK DIARY WORKFLOW</p><h1>Dayframe Ink</h1></div><span class="ver">V2</span></div><div class="card"><div class="paper"><div class="header"><div class="box"><canvas></canvas></div><div class="box"><canvas></canvas></div></div><div class="art"><span class="ghost">그림 영역</span><canvas></canvas></div><div class="note"><canvas></canvas><i class="guide g1"></i><i class="guide g2"></i><i class="guide g3"></i></div></div><div class="controls"><div class="row"><label>자글자글함</label><input id="grain" type="range" min="0" max="100" value="78"><output>78</output></div><div class="row"><label>잉크 밀도</label><input id="density" type="range" min="40" max="100" value="91"><output>91</output></div><div class="row"><label>미세 굵기 편차</label><input id="pressure" type="range" min="0" max="100" value="24"><output>24</output></div><div class="row"><label>기본 굵기</label><input id="width" type="range" min="2.5" max="8" step=".1" value="5.1"><output>5.1</output></div></div><div class="swatch"><i class="dot"></i> Warm ink black · #191816</div><p class="desc">프레임의 중심선은 반듯하게 유지하고 외곽 픽셀/잉크 가장자리만 촘촘하게 자글자글해지는 방식입니다. 원고지 칸은 사용하지 않고 기존 3줄 지문 구조를 유지합니다.</p></div><div class="workflow"><section class="wf"><h2>1 · 캐릭터 레퍼런스</h2><label class="upload">＋ 기준 이미지 추가<input id="refs" type="file" accept="image/*" multiple></label><div class="thumbs" id="thumbs"></div><label class="label">캐릭터 이름</label><input id="name" class="field" placeholder="예: 이히리"><label class="label">반드시 유지할 특징</label><textarea id="notes" class="field" placeholder="헤어, 비율, 의상 등"></textarea></section><section class="wf"><h2>2 · 오늘의 기록</h2><textarea id="diary" class="field area" placeholder="오늘 있었던 일을 자유롭게 적어주세요."></textarea><div class="seg"><button class="on" data-mode="single">1컷 그림일기</button><button data-mode="four">4컷 만화</button></div><button class="action primary" id="compose">장면 구성하기</button><div id="scenes"></div></section><section class="wf"><h2>3 · 최종 프롬프트</h2><p class="hint">현재 Ink 스타일의 진한 펠트/잉크 프레임 질감을 포함해 ChatGPT용 프롬프트를 만듭니다.</p><textarea id="prompt" class="field prompt"></textarea><button class="action primary" id="build">Ink V2 프롬프트 만들기</button><button class="action" id="copy">프롬프트 복사</button></section></div></div><script>
const q=s=>document.querySelector(s),cs=[...document.querySelectorAll('canvas')],ids=['grain','density','pressure','width'];let mode='single',sceneData=[];function hash(n){return (Math.sin(n*127.1)*43758.5453)%1}function line(ctx,a,b,c,d,seed){const G=+q('#grain').value/100,D=+q('#density').value/100,P=+q('#pressure').value/100,W=+q('#width').value,L=Math.hypot(c-a,d-b),N=Math.max(60,Math.floor(L/2.3)),nx=-(d-b)/L,ny=(c-a)/L;for(let pass=0;pass<3;pass++){ctx.beginPath();for(let i=0;i<=N;i++){let t=i/N,x=a+(c-a)*t,y=b+(d-b)*t;let hi=(hash(seed+i*37+pass*101)-.5)*G*.72;let micro=(Math.sin(i*2.7+seed)+Math.sin(i*5.3+seed*.7))*.13*G;let felt=(hash(seed+i*71+pass*19)-.5)*G*.34;let off=hi+micro+felt;x+=nx*off;y+=ny*off;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=`rgba(25,24,22,${Math.min(.98,.42+D*.5-pass*.105)})`;ctx.lineWidth=Math.max(1,W*(1+(hash(seed+i+pass)-.5)*P*.045)-pass*.72);ctx.stroke()}}function draw(c,s){let r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;let x=c.getContext('2d');x.scale(d,d);let p=3;line(x,p,p,r.width-p,p,s+1);line(x,r.width-p,p,r.width-p,r.height-p,s+2);line(x,r.width-p,r.height-p,p,r.height-p,s+3);line(x,p,r.height-p,p,p,s+4)}function render(){ids.forEach(id=>q('#'+id).nextElementSibling.textContent=q('#'+id).value);cs.forEach((c,i)=>draw(c,73+i*19))}ids.forEach(id=>q('#'+id).addEventListener('input',render));addEventListener('resize',render);render();
const refs=[];q('#refs').onchange=e=>{[...e.target.files].slice(0,5-refs.length).forEach(f=>{const rd=new FileReader;rd.onload=()=>{refs.push(rd.result);const im=new Image;im.src=rd.result;q('#thumbs').append(im);localStorage.setItem('dayframeInk.refs',JSON.stringify(refs))};rd.readAsDataURL(f)})};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on',x===b))});
function compose(){const t=q('#diary').value.trim();if(!t)return alert('오늘의 기록을 먼저 적어주세요.');const a=t.split(/\\n+|(?<=[.!?])\\s+/).filter(Boolean),n=mode==='four'?4:1;sceneData=Array.from({length:n},(_,i)=>a[i]||t);q('#scenes').innerHTML=sceneData.map((v,i)=>'<label class="label">'+(mode==='four'?'CUT '+(i+1):'장면 설명')+'</label><textarea class="field scene" data-i="'+i+'">'+v+'</textarea><label class="label">나중에 넣을 지문</label><textarea class="field caption" data-i="'+i+'"></textarea>').join('');document.querySelectorAll('.scene').forEach(x=>x.oninput=()=>sceneData[+x.dataset.i]=x.value)}
q('#compose').onclick=compose;
function build(){if(!sceneData.length)compose();const n=q('#name').value.trim()||'MY CHARACTER',notes=q('#notes').value.trim()||'Preserve the reference character exactly.',caps=[...document.querySelectorAll('.caption')].map(x=>x.value),cuts=sceneData.map((x,i)=>'CUT '+(i+1)+'\\nSCENE: '+x+'\\nCAPTION TO ADD LATER: '+(caps[i]||'(none)')).join('\\n\\n');q('#prompt').value=`DAYFRAME INK — V2 IMAGE PROMPT

Use the uploaded character reference image(s) as the master identity reference for ${n}.
IDENTITY LOCK: ${notes}
Preserve the exact face, hair silhouette, clothing construction and original miniature body proportions.

INK FRAME STYLE — ABSOLUTE
- The diary/panel frame is a very dark warm ink black, approximately #191816.
- Overall frame geometry stays straight, stable and rectangular.
- The CENTER PATH of each line must not visibly wobble.
- The entire OUTER AND INNER EDGES of the stroke have dense, tiny, high-frequency felt-fiber irregularity, like a black felt marker on slightly fibrous paper or a scanned printed ink line.
- The tiny fuzz/granulation occurs continuously and closely along the whole stroke, not as occasional large bumps.
- Texture must extend both inward and outward from the nominal stroke boundary.
- Use subtle micro variations in ink density and width, but never broad waves, jagged spikes or widely spaced rough bumps.
- Frame strokes are dark and confident; guide lines are thinner/lighter but share restrained micro-fiber texture.
- Apply this ink texture ONLY to diary frames, panel borders and guide structures, never to character/scene artwork.
- NO manuscript/grid cells. Use simple horizontal writing guide lines.

FORMAT
${mode==='four'?'Create exactly four panels in a balanced 2×2 page with simple caption writing guides.':'Create one Korean picture-diary page with a small blank header, one large illustration area, and a lower writing area with EXACTLY THREE evenly spaced horizontal guide lines. Keep equal visual breathing room above the first and below the third guide line.'}

${cuts}

Do not render caption text, date, weather, logo or watermark. Dayframe Ink adds text later.
Generate the artwork now.`};q('#build').onclick=build;q('#copy').onclick=async()=>{if(!q('#prompt').value)build();await navigator.clipboard.writeText(q('#prompt').value)};
try{q('#name').value=localStorage.getItem('dayframeInk.name')||'';q('#notes').value=localStorage.getItem('dayframeInk.notes')||'';q('#diary').value=localStorage.getItem('dayframeInk.diary')||'';refs.push(...JSON.parse(localStorage.getItem('dayframeInk.refs')||'[]'));refs.forEach(src=>{const im=new Image;im.src=src;q('#thumbs').append(im)})}catch{}['name','notes','diary'].forEach(id=>q('#'+id).oninput=()=>localStorage.setItem('dayframeInk.'+id,q('#'+id).value));
</script></body></html>
