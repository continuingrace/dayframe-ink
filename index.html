<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f0e7"><title>Dayframe Ink</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f0e7;color:#191816;font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif}.wrap{max-width:760px;margin:auto;padding:22px 18px 64px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.eyebrow{font-size:10px;letter-spacing:.15em;color:#777;margin:0 0 4px}.head h1{font-size:23px;margin:0}.ver{font-size:12px;padding:6px 9px;background:#e7e1d6;border-radius:99px}.card{background:#fffdf8;border-radius:24px;padding:17px;box-shadow:0 10px 32px #3c33230d}.paper{background:#fff;padding:15px;border-radius:5px}.header{display:grid;grid-template-columns:1.4fr .8fr;gap:10px;margin-bottom:11px}.box{height:38px;position:relative}.art{height:360px;position:relative;margin-bottom:11px;background:#fdfdfb}.ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:13px}.note{height:142px;position:relative}.guide{position:absolute;left:16px;right:16px;height:1px;background:#625f58;opacity:.56}.g1{top:40px}.g2{top:80px}.g3{top:120px}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.controls{display:grid;gap:13px;margin-top:18px}.row{display:grid;grid-template-columns:104px 1fr 45px;gap:10px;align-items:center}.row label{font-size:12px;font-weight:650}.row output{font-size:11px;color:#777;text-align:right}input{width:100%}.desc{font-size:12px;color:#777;line-height:1.6;margin:16px 2px 0}.swatch{display:inline-flex;align-items:center;gap:7px;margin-top:12px;font-size:11px;color:#666}.dot{width:14px;height:14px;border-radius:50%;background:#191816;border:1px solid #ddd}
</style></head><body><div class="wrap"><div class="head"><div><p class="eyebrow">INK FRAME STUDY</p><h1>Dayframe Ink</h1></div><span class="ver">V1</span></div><div class="card"><div class="paper"><div class="header"><div class="box"><canvas></canvas></div><div class="box"><canvas></canvas></div></div><div class="art"><span class="ghost">그림 영역</span><canvas></canvas></div><div class="note"><canvas></canvas><i class="guide g1"></i><i class="guide g2"></i><i class="guide g3"></i></div></div><div class="controls"><div class="row"><label>자글자글함</label><input id="grain" type="range" min="0" max="100" value="78"><output>78</output></div><div class="row"><label>잉크 밀도</label><input id="density" type="range" min="40" max="100" value="91"><output>91</output></div><div class="row"><label>미세 굵기 편차</label><input id="pressure" type="range" min="0" max="100" value="24"><output>24</output></div><div class="row"><label>기본 굵기</label><input id="width" type="range" min="2.5" max="8" step=".1" value="5.1"><output>5.1</output></div></div><div class="swatch"><i class="dot"></i> Warm ink black · #191816</div><p class="desc">프레임의 중심선은 반듯하게 유지하고 외곽 픽셀/잉크 가장자리만 촘촘하게 자글자글해지는 방식입니다. 원고지 칸은 사용하지 않고 기존 3줄 지문 구조를 유지합니다.</p></div></div><script>
const q=s=>document.querySelector(s),cs=[...document.querySelectorAll('canvas')],ids=['grain','density','pressure','width'];function hash(n){return (Math.sin(n*127.1)*43758.5453)%1}function line(ctx,a,b,c,d,seed){const G=+q('#grain').value/100,D=+q('#density').value/100,P=+q('#pressure').value/100,W=+q('#width').value,L=Math.hypot(c-a,d-b),N=Math.max(60,Math.floor(L/2.3)),nx=-(d-b)/L,ny=(c-a)/L;for(let pass=0;pass<3;pass++){ctx.beginPath();for(let i=0;i<=N;i++){let t=i/N,x=a+(c-a)*t,y=b+(d-b)*t;let hi=(hash(seed+i*9+pass*101)-.5)*G*1.75;let micro=Math.sin(i*.91+seed)*G*.32;let off=hi+micro;x+=nx*off;y+=ny*off;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=`rgba(25,24,22,${Math.min(.98,.42+D*.5-pass*.105)})`;ctx.lineWidth=Math.max(1,W*(1+Math.sin(seed*1.7+pass)*P*.055)-pass*.72);ctx.stroke()}}function draw(c,s){let r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;let x=c.getContext('2d');x.scale(d,d);let p=3;line(x,p,p,r.width-p,p,s+1);line(x,r.width-p,p,r.width-p,r.height-p,s+2);line(x,r.width-p,r.height-p,p,r.height-p,s+3);line(x,p,r.height-p,p,p,s+4)}function render(){ids.forEach(id=>q('#'+id).nextElementSibling.textContent=q('#'+id).value);cs.forEach((c,i)=>draw(c,73+i*19))}ids.forEach(id=>q('#'+id).addEventListener('input',render));addEventListener('resize',render);render();
</script></body></html>
