<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dayframe Ink V60</title></head><body><script>
(async()=>{
  const res=await fetch('./base-v59.html?v=60-base',{cache:'no-store'});
  let h=await res.text();
  const must=(from,to,label)=>{if(!h.includes(from))throw new Error('V60 patch anchor missing: '+label);h=h.replace(from,to)};
  must('<span class="ver">V59</span>','<span class="ver">V60</span>','version');
  h=h.replaceAll('Ink V59 프롬프트 만들기','Ink V60 프롬프트 만들기').replaceAll('DAYFRAME INK — V59 IMAGE PROMPT','DAYFRAME INK — V60 IMAGE PROMPT');
  must('.art{height:auto;aspect-ratio:4/5;overflow:hidden;background:#fff}.placedCanvas{position:absolute;inset:0;width:100%;height:100%;display:none;z-index:1;background:#fff;object-fit:fill;pointer-events:none}',
       '.art{height:auto;aspect-ratio:4/5;overflow:hidden;background:#fff;width:100%;min-width:0;max-width:100%;contain:layout paint}.placedCanvas{position:absolute;left:0;top:0;right:auto;bottom:auto;width:100%!important;height:100%!important;max-width:none!important;display:none;z-index:1;background:#fff;object-fit:fill!important;object-position:0 0!important;pointer-events:none;transform:none!important;margin:0!important;padding:0!important;border:0!important}',
       'art geometry css');
  must('<div class="outerframepanel"><p class="typepanel-title">긴 Dayframe 전체 선 색</p><p class="hint">선 굵기는 위 Dayframe의 ‘기본 굵기’ 레버 하나로 상단 2칸·가운데 그림 4컷·하단 기록칸까지 모두 함께 조절됩니다. 선 색도 이 긴 Dayframe 전체에 함께 적용됩니다.</p><div class="minirow"><label class="range colorrow">상단 2칸 + 그림 + 하단 기록 선 색<span class="colorwell"><input id="outerFrameColor" type="color" value="#302e2a"></span></label></div></div><div class="guidepanel"><p class="typepanel-title">하단 줄라인</p>',
       '<div class="outerframepanel"><p class="typepanel-title">Ink 테두리 색</p><p class="hint">위의 ‘프레임 선 색’ 선택기 하나로 상단 2칸·그림 4컷·하단 기록칸의 Ink 테두리 색을 함께 변경합니다. 하단 기록칸의 줄라인 색·농도는 아래 별도 설정입니다.</p></div><div class="guidepanel"><p class="typepanel-title">하단 줄라인 · Ink 테두리와 별도</p>',
       'duplicate frame color UI');
  must('<div class="framecolorcontrol"><span>프레임 선 색</span><span class="colorwell"><input id="frameColorTop" type="color" value="#302e2a" aria-label="프레임 선 색"></span><output id="frameColorHex">#302e2a</output></div>',
       '<div class="framecolorcontrol"><span>프레임 선 색</span><span class="colorwell"><input id="frameColorTop" type="color" value="#302e2a" aria-label="프레임 선 색"></span><output id="frameColorHex">#302e2a</output></div><p class="hint">상단 2칸·그림 4컷·하단 기록칸의 Ink 테두리 색을 함께 변경합니다. 하단 기록칸 줄라인 색·농도는 별도 설정입니다.</p>',
       'single frame color copy');
  must("function setFrameColor(value,save=true){const v=value||'#302e2a';outerFrameStyle.color=v;const top=q('#frameColorTop'),later=q('#outerFrameColor'),hex=q('#frameColorHex');if(top&&top.value!==v)top.value=v;if(later&&later.value!==v)later.value=v;if(hex)hex.textContent=v.toLowerCase();if(save)localStorage.setItem('dayframeInk.frameColor',v);const placed=q('#placedCanvas'),wasPlaced=!!(placed&&placed.style.display==='block'&&resultImg);if(wasPlaced){placedSnapshot=renderProcessed45(true);delete placed.dataset.snapshotReady;drawPlacedArt()}else{placedSnapshot=null;if(placed)delete placed.dataset.snapshotReady}render()}\nq('#frameColorTop').oninput=e=>setFrameColor(e.target.value);\nq('#outerFrameColor').oninput=e=>setFrameColor(e.target.value);",
       "function setFrameColor(value,save=true){const v=value||'#302e2a';outerFrameStyle.color=v;const top=q('#frameColorTop'),hex=q('#frameColorHex');if(top&&top.value!==v)top.value=v;if(hex)hex.textContent=v.toLowerCase();if(save)localStorage.setItem('dayframeInk.frameColor',v);render()}\nq('#frameColorTop').oninput=e=>setFrameColor(e.target.value);",
       'single-layer color handler');
  must("q('#editStatus').textContent=diff>.02?'⚠️ 4:5가 아닌 이미지입니다. 원본은 자르지 않지만 다시 생성하는 것을 권장합니다.':!pxqa.ok?'⚠️ 픽셀 계약 불일치: '+pxqa.msg+' 프레임은 생성 이미지에 맞춰 변형하지 않고 Dayframe 고정 좌표를 유지합니다.':qa.ok?'✓ '+pxqa.msg+' Dayframe 고정 프레임 좌표를 사용합니다.':'⚠️ 픽셀 크기/빈영역은 통과했지만 CUT 경계가 기준에서 벗어났습니다. V59 프롬프트로 다시 생성하는 것을 권장합니다. (경계 오차 약 '+qa.err+'px)'",
       "q('#editStatus').textContent=diff>.02?'⚠️ 4:5가 아닌 이미지입니다. 원본은 자르지 않고 전체 이미지를 그대로 유지합니다.':!pxqa.ok?'⚠️ 픽셀 계약 불일치: '+pxqa.msg+' 원본은 크롭·좌우 이동 없이 유지하고 Dayframe 고정 좌표만 사용합니다.':'✓ '+pxqa.msg+' 가져오기 → 지문 편집 → 상단 배치 → 저장까지 같은 1080×1350 좌표계를 유지합니다.'",
       'import guidance');
  const placeAnchor="q('#placeInFrame').onclick=()=>";
  if(!h.includes(placeAnchor))throw new Error('V60 patch anchor missing: place handler');
  h=h.replace(placeAnchor,`function v60GeometryQA(){\n  const ar=q('#artArea'),im=q('#placedCanvas'),rr=ar.getBoundingClientRect(),ir=im.getBoundingClientRect();\n  const eps=.75,ratio=Math.abs(rr.width/rr.height-.8),same=Math.abs(rr.left-ir.left)<=eps&&Math.abs(rr.top-ir.top)<=eps&&Math.abs(rr.width-ir.width)<=eps&&Math.abs(rr.height-ir.height)<=eps;\n  return{ok:same&&ratio<.003,msg:'artArea '+rr.width.toFixed(1)+'×'+rr.height.toFixed(1)+' / placed '+ir.width.toFixed(1)+'×'+ir.height.toFixed(1)+' / Δx '+(ir.left-rr.left).toFixed(1)+' Δy '+(ir.top-rr.top).toFixed(1)}\n}\nfunction v60RasterQA(c){\n  if(!c||c.width!==1080||c.height!==1350)return{ok:false,msg:'4:5 출력 크기 불일치'};\n  const x=c.getContext('2d'),d=x.getImageData(0,0,1080,1350).data,target=[248,247,245],zones=[[533,0,547,1350],[0,668,1080,682],[0,521,533,668],[547,521,1080,668],[0,1203,533,1350],[547,1203,1080,1350]];\n  let worst=0;for(const [x0,y0,x1,y1] of zones){let n=0,bad=0;for(let y=y0;y<y1;y+=4)for(let xx=x0;xx<x1;xx+=4){const k=(y*1080+xx)*4,delta=Math.max(Math.abs(d[k]-target[0]),Math.abs(d[k+1]-target[1]),Math.abs(d[k+2]-target[2]));n++;if(delta>18)bad++}worst=Math.max(worst,n?bad/n:1)}\n  return{ok:worst<.08,msg:'1080×1350 / 14px 거터·147px 글칸 좌표 유지 / 최대 비정상 픽셀 '+Math.round(worst*100)+'%'}\n}\n${placeAnchor}`);
  must("placedSnapshot=renderProcessed45(false);const c=q('#placedCanvas');c.removeAttribute('src');delete c.dataset.snapshotReady;drawPlacedArt();c.style.display='block';q('#artFrameCanvas').style.display='block';drawArtFrames();q('#artGhost').hidden=true;",
       "placedSnapshot=renderProcessed45(false);const c=q('#placedCanvas');c.removeAttribute('src');delete c.dataset.snapshotReady;drawPlacedArt();c.style.display='block';q('#artFrameCanvas').style.display='block';drawArtFrames();q('#artGhost').hidden=true;",
       'borderless placement');
  must("q('#editStatus').textContent='현재 4:5 결과는 이미지 한 장으로 고정하고, 긴 Dayframe의 Ink 선은 별도 전용 레이어로 유지했습니다. ‘기본 굵기’와 선 색을 바꾸면 상단 2칸·가운데 그림·하단 기록칸이 함께 갱신됩니다.';q('#outerEditor').scrollIntoView({behavior:'auto',block:'nearest'})",
       "requestAnimationFrame(()=>{const g=v60GeometryQA();q('#editStatus').textContent=(g.ok?'✓ ':'⚠️ ')+'상단 배치 좌표 검증 · '+g.msg+' · 중앙 이미지는 테두리 없는 단일 레이어, Ink 테두리는 별도 1개 레이어입니다.'});q('#outerEditor').scrollIntoView({behavior:'auto',block:'nearest'})",
       'placement QA status');
  must("q('#saveImage').onclick=()=>{if(!resultImg)return alert('생성 이미지를 먼저 가져와 주세요.');if(mode==='four'&&q('#stripOldFrames').checked&&!autoGrid)autoGrid=detectGrid();last45Canvas=renderProcessed45(true);q('#savedImage').src=last45Canvas.toDataURL('image/png',1);",
       "q('#saveImage').onclick=()=>{if(!resultImg)return alert('생성 이미지를 먼저 가져와 주세요.');if(mode==='four'&&q('#stripOldFrames').checked&&!autoGrid)autoGrid=detectGrid();last45Canvas=renderProcessed45(true);const rq=v60RasterQA(renderProcessed45(false));q('#savedImage').src=last45Canvas.toDataURL('image/png',1);",
       '4x5 raster QA');
  h=h.replace("q('#editStatus').textContent='지문과 4:5 전용의 조금 더 가는 Ink 프레임을 반영한 1080×1350 이미지가 생성되었습니다. 자글자글 질감은 그대로이며, 아래 Instagram 여백 가공으로 게시용 여백도 추가할 수 있습니다.'","q('#editStatus').textContent=(rq.ok?'✓ ':'⚠️ ')+rq.msg+' · 4:5 PNG는 전체 이미지를 한 번만 1080×1350에 그리며 크롭·좌우 이동이 없습니다. Ink 테두리는 출력에 한 번만 합성됩니다.'");
  h=h.replace('// V59: the central artwork is one flattened <img> containing its Ink frame.\n  // Never draw a second artFrameCanvas over it.','// V60: placedCanvas is borderless content. artFrameCanvas is the single Ink-border layer for preview and final export.');
  h=h.replace('</style>','\n/* V60: mobile art placement invariant */\n#artArea{width:100%!important;max-width:100%!important;min-width:0!important}\n#placedCanvas{box-sizing:border-box!important}\n</style>');
  const sm=h.match(/<script>([\s\S]*)<\/script>/);if(!sm)throw new Error('V60 patched script missing');new Function(sm[1]);
  if(h.includes('id="outerFrameColor"'))throw new Error('V60 duplicate frame color control remained');
  document.open();document.write(h);document.close();
})().catch(err=>{document.body.innerHTML='<pre style="white-space:pre-wrap;padding:20px;font-family:system-ui">Dayframe Ink V60 로드 실패\n'+String(err)+'</pre>'});
</script></body></html>
